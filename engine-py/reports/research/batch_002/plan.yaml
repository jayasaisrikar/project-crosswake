leadlag_trial:
  hypothesis: H-0014
  pair: BTC->ADA
  family: leadlag
  method: 're-run engine.leadlag.engine.walk_forward (unchanged code/params) for all
    pairs, then re-price every pair with ONE EXTRA BAR of execution delay (position
    decided at t earns y[t+2], review 01 #11); BH + Holm over the pairs'' delayed
    OOS net HAC p-values; DSR of BTC->ADA vs all registry trials + pairs; PBO over
    the fixed-lag variants (>= 5 distinct); leakage = truncation re-run must reproduce
    the overlapping folds'
caveats:
- square-root impact not applied (runner)
- position_mode=sign for every model (model-side scaling not used)
- dataset columns = union of PIT members ever; ranks and predictions are PIT at t
