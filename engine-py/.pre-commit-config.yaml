# Local hooks only: they run the project's own pinned tools via uv (no extra hook repos to fetch).
# Install: `uv run --with pre-commit pre-commit install`. ruff-format is deliberately not enabled
# (the tree is not ruff-formatted; reformatting everything would churn every file).
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types: [python]
      - id: mypy
        name: mypy src
        entry: uv run mypy src
        language: system
        types: [python]
        pass_filenames: false
        stages: [manual]          # optional: `pre-commit run mypy --hook-stage manual`
