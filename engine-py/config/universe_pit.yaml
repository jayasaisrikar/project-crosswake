# Point-in-time (PIT) universe. Generated by `uv run python -m engine.data.listings`;
# see data/cleaned/listings.json for per-symbol first/last month and the per-month top lists.
#
# `symbols` is the CANDIDATE SET only (a superset, chosen by a causal rule). Membership at time t
# is decided by engine.universe.pit_universe_mask using data strictly before the rebalance boundary.
# Candidate rule: any USDT-M perp (stablecoin bases, leveraged tokens, dated contracts excluded)
# that ranked top 30 by trailing-30d perp quote volume at any month end 2020-01..2026-09 among
# symbols listed >= 60 days. This is an exact superset of what the mask can select for
# top_n <= 30, min_history_days >= 60, adv_days = 30, monthly rebalance.
# Note: includes TradFi-linked perps (XAU, XAG, PAXG, QQQ, MSTR, CRCL, INTC, MU, SAMSUNG, SKHYNIX, ...)
# because they are Binance USDT-M perps; drop them via `exclude` if a crypto-only universe is wanted.
quote: USDT
interval: 1h
start: "2020-01"
end: "2026-09"
markets: [spot, perp]     # spot only exists for a subset; strategies needing spot must AND spot validity
discovery:
  n_perps_ever_listed: 896
  n_candidates: 283
rules:
  top_n: 20
  min_history_days: 60
  adv_days: 30
  rebalance: monthly
  stale_hours: 72
exclude: []
symbols:
