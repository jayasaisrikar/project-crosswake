# Formal testable hypotheses derived from RESEARCH_DATABASE.md.
# Data available in repo: hourly Binance spot + perp OHLCV, perp funding.
# NOT available yet: open interest, liquidations, order book, on-chain, tick data.
# All targets are forward log returns measured from the NEXT bar open (no lookahead).
hypotheses:
  - id: H-0001
    research_ids: [R-001, R-003, R-041]
    statement: Sign of trailing 7-28 day return of BTC/ETH perps predicts sign of next 24-168h return net of fees+funding.
    features: [ret_168h, ret_336h, ret_672h, realized_vol_168h]
    target: fwd_return_168h
    conditions: [all, high_vol_regime, low_vol_regime]
    data_required: hourly perp OHLCV + funding (available)
    family: trend
    testable_now: true
  - id: H-0002
    research_ids: [R-002, R-020]
    statement: Cross-sectional ranking of trailing 1-4 week returns across liquid Binance perps yields positive long-short returns over the next week after costs.
    features: [xs_rank_ret_168h, xs_rank_ret_672h]
    target: fwd_return_168h_xs_demeaned
    conditions: [all, btc_uptrend, btc_downtrend]
    data_required: hourly perp OHLCV universe (available)
    family: momentum
    testable_now: true
  - id: H-0003
    research_ids: [R-004]
    statement: Momentum strategy losses concentrate after large market drawdowns combined with high realized vol; scaling exposure down in that state improves Sharpe and max drawdown.
    features: [btc_ret_720h, realized_vol_168h, momentum_signal]
    target: strategy_fwd_return_168h
    conditions: [panic_state (btc_ret_720h<0 and vol top tercile)]
    data_required: hourly OHLCV (available)
    family: momentum
    testable_now: true
  - id: H-0004
    research_ids: [R-005]
    statement: Inverse-realized-variance scaling of a trend strategy improves out-of-sample Sharpe vs unscaled, after turnover costs.
    features: [realized_var_24h, realized_var_168h]
    target: strategy_fwd_return_24h
    conditions: [all]
    data_required: hourly OHLCV (available)
    family: volatility
    testable_now: true
  - id: H-0005
    research_ids: [R-006, R-007]
    statement: HAR-RV forecasts of next-24h realized vol beat EWMA and GARCH(1,1) out of sample (QLIKE loss) for BTC/ETH.
    features: [rv_24h, rv_168h, rv_720h]
    target: realized_vol_next_24h
    conditions: [all, post_shock]
    data_required: hourly OHLCV (available; hourly RV is coarse proxy)
    family: volatility
    testable_now: true
  - id: H-0006
    research_ids: [R-006, R-005]
    statement: Sizing with HAR-RV vol forecasts reduces drawdown of existing trend/xsmom strategies relative to trailing-std sizing.
    features: [har_rv_forecast]
    target: strategy_fwd_return_24h
    conditions: [all]
    data_required: hourly OHLCV (available)
    family: volatility
    testable_now: true
  - id: H-0007
    research_ids: [R-008, R-009]
    statement: Delta-neutral long spot / short perp earns positive net return when trailing 7-day funding APR exceeds a threshold, after fees and basis slippage.
    features: [funding_apr_168h, funding_apr_24h]
    target: carry_pnl_next_168h
    conditions: [all, funding_top_quintile]
    data_required: spot + perp OHLCV + funding (available)
    family: carry
    testable_now: true
  - id: H-0008
    research_ids: [R-008]
    statement: Extremely high funding (top decile) predicts negative directional perp returns over the next 24-168h (crowded leveraged longs).
    features: [funding_rate_8h, funding_zscore_720h]
    target: fwd_return_72h
    conditions: [funding_top_decile]
    data_required: perp OHLCV + funding (available)
    family: derivatives
    testable_now: true
  - id: H-0009
    research_ids: [R-008, R-009]
    statement: Cross-sectional funding carry (long lowest-funding, short highest-funding perps) earns positive returns net of funding paid/received.
    features: [xs_rank_funding_168h]
    target: fwd_return_168h_incl_funding
    conditions: [all]
    data_required: perp OHLCV + funding universe (available)
    family: carry
    testable_now: true
  - id: H-0010
    research_ids: [R-009]
    statement: Perp-spot basis (hourly close perp/spot - 1) mean-reverts; large deviations predict basis convergence within 24h.
    features: [basis_1h, basis_zscore_168h]
    target: basis_change_next_24h
    conditions: [all]
    data_required: spot + perp OHLCV (available; close-to-close sync caveat)
    family: derivatives
    testable_now: true
  - id: H-0011
    research_ids: [R-024, R-040]
    statement: Hourly BTC/ETH returns at 1-4h horizons have negative first-order autocorrelation; fading extreme 1-4h moves is profitable after costs.
    features: [ret_1h_z, ret_4h_z]
    target: fwd_return_4h
    conditions: [all, high_vol_regime]
    data_required: hourly OHLCV (available)
    family: reversal
    testable_now: true
  - id: H-0012
    research_ids: [R-026]
    statement: After an abnormal hourly move (|z|>3), returns over next 1-6 hours continue in same direction (momentum), contradicting H-0011; test which dominates.
    features: [ret_1h_z, volume_z]
    target: fwd_return_6h
    conditions: [abnormal_move]
    data_required: hourly OHLCV (available)
    family: momentum
    testable_now: true
  - id: H-0013
    research_ids: [R-039, R-038]
    statement: Large down-moves with volume spikes (liquidation proxy) are followed by positive 24-72h reversal.
    features: [ret_4h, volume_z_4h, range_z]
    target: fwd_return_48h
    conditions: [capitulation_proxy]
    data_required: hourly OHLCV (available, proxy only); true liquidation data NOT available
    family: reversal
    testable_now: true
  - id: H-0014
    research_ids: [R-012, R-016, R-014]
    statement: Lagged BTC hourly returns Granger-predict altcoin hourly returns out of sample; any predictability is strongest at lag 1 and decays.
    features: [btc_ret_lag1, btc_ret_lag2, btc_ret_lag3]
    target: alt_fwd_return_1h
    conditions: [all, high_vol_regime]
    data_required: hourly OHLCV (available)
    family: leadlag
    testable_now: true
  - id: H-0015
    research_ids: [R-014, R-017]
    statement: BTC->alt lead-lag strength is regime-dependent (stronger in high-vol / risk-off states).
    features: [btc_ret_lag1, realized_vol_168h, regime_label]
    target: alt_fwd_return_1h
    conditions: [vol_tercile]
    data_required: hourly OHLCV (available)
    family: leadlag
    testable_now: true
  - id: H-0016
    research_ids: [R-011]
    statement: Binance perp leads Binance spot at hourly resolution (perp return lag1 predicts spot return).
    features: [perp_ret_lag1, spot_ret_lag1]
    target: spot_fwd_return_1h
    conditions: [all]
    data_required: spot + perp hourly OHLCV (available); sub-hour lead likely invisible
    family: leadlag
    testable_now: true
  - id: H-0017
    research_ids: [R-015]
    statement: Transfer entropy BTC->alt exceeds alt->BTC and adds predictive info beyond linear Granger.
    features: [binned_returns]
    target: alt_fwd_return_1h
    conditions: [all]
    data_required: hourly OHLCV (available)
    family: leadlag
    testable_now: true
  - id: H-0018
    research_ids: [R-017]
    statement: A 2-3 state Gaussian HMM fitted on rolling windows identifies regimes in which trend strategies have materially higher Sharpe out of sample.
    features: [ret_24h, realized_vol_24h]
    target: strategy_fwd_return_24h
    conditions: [hmm_state]
    data_required: hourly OHLCV (available)
    family: trend
    testable_now: true
  - id: H-0019
    research_ids: [R-018, R-019]
    statement: Reducing exposure for N hours after a BOCPD change-point detection reduces drawdowns of existing strategies without materially reducing return.
    features: [bocpd_run_length_prob]
    target: strategy_fwd_return_24h
    conditions: [post_changepoint]
    data_required: hourly OHLCV (available)
    family: trend
    testable_now: true
  - id: H-0020
    research_ids: [R-020, R-021]
    statement: A combined technical-signal score (CTREND-style, regularized linear) beats single-signal momentum cross-sectionally on liquid Binance perps OOS; nonlinear ML adds no further improvement.
    features: [ma_ratios, ret_multi_horizon, volume_signals]
    target: fwd_return_168h_xs_demeaned
    conditions: [all]
    data_required: hourly OHLCV universe (available)
    family: momentum
    testable_now: true
  - id: H-0021
    research_ids: [R-023]
    statement: Returns in the first hours after 00:00 UTC predict the remaining-day return for BTC (intraday momentum).
    features: [ret_00_02utc]
    target: ret_02_24utc
    conditions: [all, high_volume_days]
    data_required: hourly OHLCV (available)
    family: momentum
    testable_now: true
  - id: H-0022
    research_ids: [R-027, R-025]
    statement: Crypto TS momentum at 1-4 week horizons reverses at 3-12 month horizons.
    features: [ret_672h, ret_2160h, ret_8760h]
    target: fwd_return_720h
    conditions: [all]
    data_required: hourly/daily OHLCV (available; limited history for long horizons)
    family: reversal
    testable_now: true
  - id: H-0023
    research_ids: [R-028, R-029, R-030, R-031, R-032]
    statement: Of all strategy variants in experiments/registry.jsonl, the best survives DSR>0.95, PBO<0.5 and SPA p<0.05.
    features: [trial_returns_matrix]
    target: selection_validity
    conditions: [all]
    data_required: experiment registry (available)
    family: trend
    testable_now: true
  - id: H-0024
    research_ids: [R-036, R-037, R-038]
    statement: Rising OI with rising funding precedes larger downside tail moves over next 24h.
    features: [oi_change_24h, funding_rate]
    target: fwd_min_return_24h
    conditions: [high_leverage_state]
    data_required: open interest NOT available
    family: derivatives
    testable_now: false
  - id: H-0025
    research_ids: [R-037, R-038]
    statement: Liquidation volume >5% of OI predicts continuation over next 1h and reversal over 24h.
    features: [liq_volume_over_oi]
    target: [fwd_return_1h, fwd_return_24h]
    conditions: [liquidation_event]
    data_required: liquidations + OI NOT available
    family: derivatives
    testable_now: false
  - id: H-0026
    research_ids: [R-010]
    statement: L1 order-flow imbalance aggregated per minute predicts next-minute mid return on Binance perps.
    features: [ofi_1m, depth_l1]
    target: fwd_mid_return_1m
    conditions: [all]
    data_required: order book NOT available
    family: microstructure
    testable_now: false
  - id: H-0027
    research_ids: [R-033, R-034]
    statement: Large USDT/USDC mints precede positive BTC returns over the next 24h.
    features: [stablecoin_mint_usd]
    target: fwd_return_24h
    conditions: [mint_event]
    data_required: on-chain stablecoin supply NOT available
    family: onchain
    testable_now: false
  - id: H-0028
    research_ids: [R-035]
    statement: Spikes in BTC exchange inflows predict negative 24-72h returns.
    features: [exchange_inflow_z]
    target: fwd_return_72h
    conditions: [all]
    data_required: on-chain exchange flows NOT available (vendor)
    family: onchain
    testable_now: false
  - id: H-0029
    research_ids: [R-012, R-013]
    statement: Cross-exchange BTC lead-lag at seconds horizon is exploitable after fees.
    features: [venue_ret_lag_seconds]
    target: fwd_return_10s
    conditions: [all]
    data_required: multi-exchange tick data NOT available
    family: microstructure
    testable_now: false
  - id: H-0030
    research_ids: [R-008]
    statement: Funding-regime change (funding flips sign) acts as an event; returns after negative-to-positive flips differ from unconditional.
    features: [funding_sign_flip]
    target: fwd_return_72h
    conditions: [flip_event]
    data_required: funding (available)
    family: event
    testable_now: true
